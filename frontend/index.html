<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto & Gas Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 24px;
            align-items: stretch;
        }

        .card {
            flex: 1;
            max-width: 360px;
        }

        .card {
            flex: 1;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent);
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .fee-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .fee-label {
            color: #94a3b8;
        }

        .fee-value {
            font-weight: bold;
            color: #fbbf24;
        }

        .status {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="dashboard">
        <div class="card">
            <h1>🟠 Bitcoin Mempool Fees</h1>
            <div id="loader">Загрузка...</div>
            <div id="content" style="display:none;">
                <div class="fee-item">
                    <span class="fee-label">🔥 Fastest</span>
                    <span class="fee-value" id="fastest">-</span>
                </div>
                <div class="fee-item">
                    <span class="fee-label">⏳ Half Hour</span>
                    <span class="fee-value" id="halfHour">-</span>
                </div>
                <div class="fee-item">
                    <span class="fee-label">🐢 Hour</span>
                    <span class="fee-value" id="hour">-</span>
                </div>
            </div>
            <div class="status" id="updated"></div>
        </div>
    <div class="card">
        <h1>⛽ EVM Gas Tracker</h1>
        <div id="evm-loader">Загрузка...</div>
        <div id="evm-content" style="display:none;">
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left; color:#94a3b8; padding-bottom:10px;">Сеть</th>
                        <th style="text-align:right; color:#f85149; padding-bottom:10px;">High</th>
                        <th style="text-align:right; color:#fbbf24; padding-bottom:10px;">Avg</th>
                        <th style="text-align:right; color:#3fb950; padding-bottom:10px;">Low</th>
                    </tr>
                </thead>
                <tbody id="evm-table"></tbody>
            </table>
        </div>
        <div class="status" id="evm-updated"></div>
    </div>

    </div>
    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('api.php');
                const result = await response.json();

                if (result.status === 'success') {
                    const data = result.data;

                    document.getElementById('fastest').innerText = data.fastest_fee + ' sat/vB';
                    document.getElementById('halfHour').innerText = data.half_hour_fee + ' sat/vB';
                    document.getElementById('hour').innerText = data.hour_fee + ' sat/vB';
                    document.getElementById('updated').innerText = 'Last update: ' + data.created_at;
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                }
            } catch (e) {
                console.error('Ошибка загрузки данных:', e);
                document.getElementById('loader').innerText = 'Ошибка связи с API';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 30000);
        async function updateEVM() {
            try {
                const response = await fetch('evm_api.php');
                const result = await response.json();

                if (result.status === 'success') {
                    const tbody = document.getElementById('evm-table');
                    tbody.innerHTML = '';
                    result.data.forEach(row => {
                        const isEth = row.network === 'ethereum';
                        const opacity = isEth ? '1' : '0.45';
                        const fontSize = isEth ? '1.05rem' : '0.95rem';
                        tbody.innerHTML += `
                            <tr style="opacity:${opacity}; font-size:${fontSize};">
                                <td style="padding:8px 0; color:#38bdf8; font-weight:bold; text-transform:uppercase;">${row.network}</td>
                                <td style="text-align:right; color:#f85149;">${row.high}</td>
                                <td style="text-align:right; color:#fbbf24;">${row.average}</td>
                                <td style="text-align:right; color:#3fb950;">${row.low}</td>
                            </tr>`;
                    });
                    document.getElementById('evm-updated').innerText = 'Last update: ' + result.data[0].created_at;
                    document.getElementById('evm-loader').style.display = 'none';
                    document.getElementById('evm-content').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('evm-loader').innerText = 'Ошибка связи с API';
            }
        }

        updateEVM();
        setInterval(updateEVM, 30000);

    </script>

</body>

</html>
